<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>受渡連動 設定</title>
  <link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./config.js"></script>
  <style>
    body { font-size: 14px; }
    .row { margin-bottom: 8px; }
    .status { font-weight: bold; }
    .muted { color: #6b778c; font-size: 12px; }
    .err { color: #c9372c; font-size: 12px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="row">ボード: <span id="board">…</span></div>
  <div class="row">Trello連携: <span id="auth" class="status">…</span></div>
  <div class="row">連動: <span id="sync" class="status">…</span></div>

  <div class="row">
    <button id="authBtn" class="mod-primary" style="display:none">Trelloと連携する</button>
    <button id="toggleBtn" style="display:none"></button>
    <button id="checkBtn" style="display:none">状態を確認</button>
  </div>
  <div id="info" class="muted" style="word-break:break-all"></div>
  <div id="msg" class="err"></div>
  <div class="muted">このボードで「受け渡し」リストに移したミラーカードを、元ボードの「受け渡し」リストにも移します。</div>

  <script>
    var API = 'https://api.trello.com/1';
    var KEY = HANDOVER_CONFIG.appKey;
    var t = TrelloPowerUp.iframe({
      appKey: HANDOVER_CONFIG.appKey,
      appName: HANDOVER_CONFIG.appName
    });
    var api = t.getRestApi();
    var current = { authorized: false, enabled: false, boardId: null, webhookId: null };

    function $(id) { return document.getElementById(id); }

    function jfetch(url, opts) {
      return fetch(url, opts).then(function (r) {
        return r.text().then(function (txt) {
          if (!r.ok) throw new Error(r.status + ' ' + txt);
          try { return JSON.parse(txt); } catch (e) { return txt; }
        });
      });
    }

    // 同じボード・同じURLのWebhookが既にあれば再利用し、なければ作る
    function ensureWebhook(token, boardId) {
      var url = HANDOVER_CONFIG.webhookUrl;
      return jfetch(API + '/tokens/' + token + '/webhooks?key=' + KEY).then(function (list) {
        var found = (list || []).filter(function (w) {
          return w.idModel === boardId && w.callbackURL === url;
        })[0];
        if (found) return found.id;
        return jfetch(API + '/webhooks/?key=' + KEY + '&token=' + token, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            description: '受渡連動',
            callbackURL: url,
            idModel: boardId
          })
        }).then(function (w) { return w.id; });
      });
    }

    function removeWebhook(token, webhookId) {
      if (!webhookId) return Promise.resolve();
      return fetch(API + '/webhooks/' + webhookId + '?key=' + KEY + '&token=' + token, {
        method: 'DELETE'
      }).then(function (r) {
        if (!r.ok && r.status !== 404) throw new Error('Webhook削除に失敗: ' + r.status);
      });
    }

    function render() {
      return Promise.all([
        api.isAuthorized(),
        t.board('id', 'name'),
        t.get('board', 'shared', 'handoverSync')
      ]).then(function (r) {
        var state = r[2] || {};
        current.authorized = !!r[0];
        current.boardId = r[1].id;
        current.enabled = !!state.enabled;
        current.webhookId = state.webhookId || null;

        $('board').textContent = r[1].name;
        $('auth').textContent = current.authorized ? '済み' : '未連携';
        $('sync').textContent = current.enabled ? 'ON' : 'OFF';

        $('authBtn').style.display = current.authorized ? 'none' : '';
        $('toggleBtn').style.display = current.authorized ? '' : 'none';
        $('toggleBtn').textContent = current.enabled ? '連動をOFFにする' : '連動をONにする';
        $('toggleBtn').className = current.enabled ? '' : 'mod-primary';
        $('checkBtn').style.display = (current.authorized && current.enabled) ? '' : 'none';
        t.sizeTo(document.body).catch(function () {});
      });
    }

    function showError(e) {
      $('msg').textContent = 'エラー: ' + (e && e.message ? e.message : e);
      $('toggleBtn').disabled = false;
    }

    $('authBtn').addEventListener('click', function () {
      $('msg').textContent = '';
      api.authorize({ scope: 'read,write' }).then(render).catch(showError);
    });

    $('toggleBtn').addEventListener('click', function () {
      $('msg').textContent = '';
      $('toggleBtn').disabled = true;

      var task;
      if (current.enabled) {
        // OFF: Webhookを削除してから、状態を消す
        task = api.getToken().then(function (token) {
          return removeWebhook(token, current.webhookId);
        }).then(function () {
          return t.remove('board', 'shared', 'handoverSync');
        });
      } else {
        // ON: Webhookを登録してから、状態を保存する
        if (!HANDOVER_CONFIG.webhookUrl || HANDOVER_CONFIG.webhookUrl.indexOf('https://') !== 0) {
          return showError('config.js の webhookUrl が未設定です');
        }
        task = api.getToken().then(function (token) {
          return ensureWebhook(token, current.boardId);
        }).then(function (webhookId) {
          return t.set('board', 'shared', 'handoverSync', {
            enabled: true,
            boardId: current.boardId,
            webhookId: webhookId,
            at: new Date().toISOString()
          });
        });
      }

      task.then(render).then(function () {
        $('toggleBtn').disabled = false;
      }).catch(showError);
    });

    // Webhookの状態を表示する(原因調べ用)
    $('checkBtn').addEventListener('click', function () {
      $('msg').textContent = '';
      var info = $('info');
      info.textContent = '確認中…';
      if (!current.webhookId) {
        info.textContent = 'Webhookが未登録です。一度OFFにして、もう一度ONにしてください。';
        t.sizeTo(document.body).catch(function () {});
        return;
      }
      api.getToken().then(function (token) {
        return jfetch(API + '/webhooks/' + current.webhookId + '?key=' + KEY + '&token=' + token);
      }).then(function (w) {
        info.innerHTML =
          '有効: ' + w.active + '<br>' +
          '連続失敗回数: ' + w.consecutiveFailures + '<br>' +
          '通知先: ' + w.callbackURL + '<br>' +
          '設定のURL: ' + HANDOVER_CONFIG.webhookUrl;
        t.sizeTo(document.body).catch(function () {});
      }).catch(function (e) {
        info.textContent = '';
        showError(e);
      });
    });

    render().catch(showError);
  </script>
</body>
</html>
